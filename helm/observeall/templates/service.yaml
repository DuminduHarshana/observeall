apiVersion: v1
kind: Service
metadata:
  name: {{ include "observeall.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observeall.labels" . | nindent 4 }}
spec:
  type: {{ .Values.collector.service.type }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.collector.service.ports.otlpGrpc }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.collector.service.ports.otlpHttp }}
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: {{ .Values.collector.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
    - name: health
      port: {{ .Values.collector.service.ports.healthCheck }}
      targetPort: health
      protocol: TCP
  selector:
    {{- include "observeall.selectorLabels" . | nindent 4 }}
