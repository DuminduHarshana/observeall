{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observeall.fullname" . }}
  labels:
    {{- include "observeall.labels" . | nindent 4 }}
rules:
  # Allow the collector to read pod/node/namespace metadata for k8sattributes processor
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observeall.fullname" . }}
  labels:
    {{- include "observeall.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "observeall.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "observeall.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
