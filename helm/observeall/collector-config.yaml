# =============================================================
# ObserveAll — OTel Collector Pipeline Config
# Project: my-project
# Generated by: observeall CLI
# =============================================================

receivers:
  # OTLP receiver — accepts traces, metrics, logs via gRPC and HTTP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus scrape receiver (for infrastructure metrics)
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  # Limit memory usage of the collector
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Batch signals before exporting (improves throughput)
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Enrich all signals with deployment metadata
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
      - key: observeall.version
        value: "1.0"
        action: upsert

  # Tail-based sampling — makes smart decisions after seeing full traces
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 1000
    policies:
      # Always sample traces with errors
      - name: errors-policy
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Always sample slow traces (> 500ms)
      - name: slow-traces-policy
        type: latency
        latency:
          threshold_ms: 500
      # Probabilistic 10% fallback for normal traces
      - name: probabilistic-policy
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  # Prometheus Remote Write exporter
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

  # Debug exporter — prints signals to stdout (useful for development)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch, resource]
      exporters: [prometheusremotewrite, debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
