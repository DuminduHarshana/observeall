# =============================================================
# ObserveAll Backend Secrets Template
# Copy this file, fill in values, and apply:
#   kubectl apply -f secret.yaml -n observeall
#
# OR use kubectl directly:
#   kubectl create secret generic observeall-backend-secrets \
#     --from-literal=DD_API_KEY=your-key \
#     --from-literal=DT_API_TOKEN=your-token \
#     --from-literal=DT_ENDPOINT=https://xxx.live.dynatrace.com \
#     --from-literal=GRAFANA_TOKEN=your-base64-token \
#     --from-literal=NR_LICENSE_KEY=your-key \
#     -n observeall
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: observeall-backend-secrets
  namespace: observeall
type: Opaque
stringData:
  DD_API_KEY: ""           # Datadog API key
  DT_API_TOKEN: ""         # Dynatrace API token
  DT_ENDPOINT: ""          # Dynatrace OTLP endpoint
  GRAFANA_TOKEN: ""        # Grafana Cloud base64 token
  NR_LICENSE_KEY: ""       # New Relic license key
  CUSTOM_OTLP_ENDPOINT: "" # Custom OTLP endpoint
